name: shortvideo-skill CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install Pillow

      - name: Lint every example input.json
        run: |
          set -e
          for f in examples/*/input.json; do
            python3 scripts/lint_recipe.py "$f" --json > /tmp/lint.json || true
            python3 .github/workflows/scripts/check_lint.py /tmp/lint.json "$f"
          done

      - name: Import-smoke test every script
        run: |
          set -e
          for f in scripts/*.py; do
            python3 .github/workflows/scripts/check_import.py "$f"
          done

      - name: Validate SKILL.md / agent / command frontmatter
        run: |
          set -e
          for f in .claude/skills/*/SKILL.md .claude/agents/*.md .claude/commands/*.md; do
            python3 .github/workflows/scripts/check_frontmatter.py "$f"
          done

      - name: Verify bundled font exists and is reasonable size
        run: |
          test -f fonts/NotoSansCJKjp-Regular.otf || { echo "::error::bundled font missing"; exit 1; }
          SIZE=$(stat -c%s fonts/NotoSansCJKjp-Regular.otf)
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error::bundled font too small ($SIZE bytes), expected >10MB"
            exit 1
          fi
          echo "font ok: $SIZE bytes"

      - name: Verify install.sh is executable
        run: |
          test -x install.sh || { echo "::error::install.sh not executable"; exit 1; }
          bash -n install.sh
          echo "install.sh syntax ok"

      - name: Verify every example output.mp4 plays
        run: |
          set -e
          for f in examples/*/output.mp4; do
            python3 .github/workflows/scripts/check_output_mp4.py "$f"
          done

      - name: Monitor sha256 of trust-boundary files (lint / rubric / few-shot)
        run: |
          python3 .github/workflows/scripts/check_sha256.py .github/baseline-sha256.txt

      - name: Determinism flag check (PIX_FMT / CRF / PRESET / overlap thresholds)
        run: |
          python3 .github/workflows/scripts/check_determinism_flags.py
